<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TomType</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="stats-panel container">
    <div class="top-bar">
      <h1 class="logo">Lifetime stats</h1>
    </div>
    <p>Games Played: <span id="lifetime-games">0</span></p>
    <p>Avg WPM: <span id="lifetime-wpm">0</span></p>
  </div>

  <div class="container">
    <div class="top-bar">
      <h1 class="logo">TomType</h1>
    </div>
    <br>
    <header>
      <div class="options">
        <button>English</button>
        <button>Italian</button>
        <button>Tech</button>
        <button>Cat</button>
        <button>Quotes</button>
      </div>
      <div class="stats">
        <div id="timer">35s</div>
        <div id="wpm">0 WPM</div>
      </div>
    </header>

    
    <div id="words-box"></div>
    
    <div class="progress">
      <div id="cat-sprite"><img src="img/cat.png" alt=""></div>
      <div id="fish-sprite"><img src="img/mouse.png" alt=""></div>
    </div>

    <div id="results" class="hidden">
      <h2> Well Done! </h2>
      <p>Speed: <span id="result-wpm">0</span> WPM</p>
      <button onclick="reset()">Restart</button>
    </div>
  </div>


  <div class="commands">
    <h5>Click "Tab" to restart</h5>
  </div>

  <script src="main.js"></script>
</body>
</html>
